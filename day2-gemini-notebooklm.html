<style>
  :root{
    --bg: #0A0A0F;
    --surface: #14141C;
    --surface-2: #1B1B28;
    --accent: #6B5CE7;
    --accent-soft: #A79CFF;
    --ink: #F4F2FB;
    --ink-muted: #8E89A6;
    --line: #232231;
    --font-display: 'Manrope', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  *{ box-sizing: border-box; margin: 0; padding: 0; }

  html, body{
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-display);
    overflow: hidden;
  }

  body{
    position: relative;
    background:
      radial-gradient(ellipse 900px 600px at 88% 8%, rgba(107,92,231,0.10), transparent 60%),
      var(--bg);
  }

  .deck{
    position: relative;
    width: 100vw;
    height: 100dvh;
  }

  .slide{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(28px, 5.5vw, 88px) clamp(24px, 8vw, 132px);
    opacity: 0;
    transform: translateY(14px);
    pointer-events: none;
    transition: opacity 0.46s cubic-bezier(.22,.61,.36,1), transform 0.46s cubic-bezier(.22,.61,.36,1);
  }
  .slide.active{
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  @media (prefers-reduced-motion: reduce){
    .slide{ transition: opacity 0.15s linear; transform: none; }
  }

  /* ---------- meta chrome (memory tag + counter) ---------- */
  .meta-row{
    position: absolute;
    top: clamp(20px, 3.4vw, 40px);
    left: clamp(24px, 8vw, 132px);
    right: clamp(24px, 8vw, 132px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    z-index: 5;
  }
  .meta-row .tag{ color: var(--accent-soft); }
  .meta-row .brand{
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0.55;
  }

  /* ---------- thread progress bar ---------- */
  .thread{
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 46px;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 clamp(24px, 8vw, 132px);
    z-index: 5;
  }
  .thread .seg{
    flex: 1;
    height: 2px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .thread .seg::after{
    content: '';
    position: absolute; inset: 0;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.5s ease;
  }
  .thread .seg.done::after{ transform: scaleX(1); }

  /* ---------- nav buttons ---------- */
  .navbtn{
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(20,20,28,0.6);
    backdrop-filter: blur(6px);
    color: var(--ink-muted);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 6;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }
  .navbtn:hover{ border-color: var(--accent); color: var(--ink); }
  .navbtn:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  .navbtn.prev{ left: clamp(10px, 2vw, 28px); }
  .navbtn.next{ right: clamp(10px, 2vw, 28px); }
  .navbtn svg{ width: 18px; height: 18px; }
  @media (max-width: 640px){ .navbtn{ display: none; } }

  /* ---------- typography helpers ---------- */
  .eyebrow{
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-soft);
    margin-bottom: 18px;
  }
  h1.title{
    font-size: clamp(38px, 6.4vw, 82px);
    font-weight: 800;
    line-height: 1.03;
    letter-spacing: -0.02em;
    max-width: 16ch;
    overflow-wrap: break-word;
  }
  h2.head{
    font-size: clamp(28px, 4.2vw, 52px);
    font-weight: 800;
    line-height: 1.08;
    letter-spacing: -0.015em;
    max-width: 18ch;
    overflow-wrap: break-word;
  }
  .lead{
    font-size: clamp(16px, 1.7vw, 21px);
    color: var(--ink-muted);
    max-width: 62ch;
    margin-top: 14px;
    line-height: 1.55;
  }
  .sub{
    font-size: clamp(17px, 2vw, 24px);
    color: var(--ink-muted);
    font-weight: 500;
    margin-top: 16px;
    max-width: 44ch;
  }

  /* ---------- title slide ---------- */
  .tpl-title .meta-line{
    display: flex; gap: 10px; align-items: center;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink-muted);
    margin-top: clamp(28px, 5vw, 48px);
    padding-top: 20px;
    border-top: 1px solid var(--line);
    max-width: 560px;
  }
  .tpl-title .meta-line .dot{ width:5px; height:5px; border-radius:50%; background: var(--accent); flex-shrink:0; }

  /* ---------- outcome checklist ---------- */
  .outcome-grid{
    margin-top: clamp(24px,4vw,40px);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 56px;
    max-width: 980px;
  }
  .outcome-item{
    display: flex; gap: 16px;
    padding: 20px 0;
    border-top: 1px solid var(--line);
  }
  .outcome-item .check{
    flex-shrink: 0; width: 22px; height: 22px; margin-top: 2px;
    border-radius: 6px;
    border: 1.5px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .outcome-item .check svg{ width: 12px; height: 12px; }
  .outcome-item .otext strong{ display:block; font-size: 16.5px; font-weight: 700; margin-bottom: 4px; }
  .outcome-item .otext span{ font-size: 14px; color: var(--ink-muted); line-height: 1.5; display:block; }
  @media (max-width: 760px){ .outcome-grid{ grid-template-columns: 1fr; } }

  /* ---------- problem slide ---------- */
  .quoteline{
    font-family: var(--font-mono);
    font-size: clamp(14px,1.6vw,17px);
    color: var(--accent-soft);
    margin-top: clamp(28px,4vw,44px);
    padding-top: 20px;
    border-top: 1px solid var(--line);
    max-width: 640px;
    display: flex; gap: 10px;
  }

  /* ---------- agenda ---------- */
  .agenda-list{ margin-top: clamp(24px,4vw,40px); max-width: 760px; }
  .agenda-row{
    display: flex; align-items: baseline; gap: 22px;
    padding: 18px 0;
    border-top: 1px solid var(--line);
  }
  .agenda-row:last-child{ border-bottom: 1px solid var(--line); }
  .agenda-row .num{
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--accent-soft);
    width: 24px;
    flex-shrink: 0;
  }
  .agenda-row .txt{ font-size: clamp(16px,1.8vw,20px); font-weight: 600; }

  /* ---------- feature slide ---------- */

  .points{ margin-top: clamp(22px,3.5vw,36px); display: flex; flex-direction: column; gap: 0; }
  .point-row{
    display: flex; gap: 18px;
    padding: 14px 0;
    border-top: 1px solid var(--line);
  }
  .point-row .pnum{
    font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-muted);
    width: 20px; flex-shrink: 0; margin-top: 3px;

  .point-row .ptxt{ font-size: clamp(14.5px,1.6vw,16.5px); line-height: 1.5; color: var(--ink); }
  .howto{
    margin-top: clamp(20px,3vw,32px);
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--accent-soft);
    display: flex; gap: 8px; align-items: center;
    max-width: 720px;
  }

  /* ---------- live case (numbered narrative) ---------- */
  .case-list{ margin-top: clamp(24px,4vw,40px); max-width: 620px; position: relative; }
  .case-item{ display: flex; gap: 22px; position: relative; padding-bottom: 30px; }
  .case-item:last-child{ padding-bottom: 0; }
  .case-item .thr{
    position: absolute; left: 15px; top: 34px; bottom: 6px;
    width: 1px; background: var(--line);
  }
  .case-item:last-child .thr{ display: none; }
  .case-item .cnum{
    flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 13px; color: var(--accent-soft);
    z-index: 1;
  }
  .case-item .ctxt{ font-size: clamp(15px,1.7vw,17.5px); line-height: 1.5; padding-top: 5px; }

  /* ---------- comparison table ---------- */
  .table-wrap{ margin-top: clamp(22px,4vw,36px); max-width: 1120px; overflow-x: auto; }
  table.cmp{ border-collapse: collapse; width: 100%; min-width: 760px; }
  table.cmp th{
    text-align: left; font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted);
    padding: 0 10px 14px 0; font-weight: 500; line-height: 1.3;
    border-bottom: 1px solid var(--line);
  }
  table.cmp td{
    padding: 14px 10px 14px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  table.cmp td:first-child, table.cmp th:first-child{ color: var(--ink); font-weight: 600; }
  table.cmp td.win{ color: var(--accent-soft); font-weight: 600; }
  table.cmp td.yes{ color: var(--accent-soft); font-weight: 700; }
  table.cmp td.no{ color: var(--ink-dim, #55506b); }
  .table-foot{
    margin-top: 20px; font-size: 13.5px; color: var(--ink-muted);
    display: flex; gap: 8px; align-items: center;
  }

  /* ---------- cycle flow ---------- */
  .cycle-wrap{ margin-top: clamp(30px,5vw,56px); }
  .cycle-row{ display: flex; align-items: flex-start; gap: 0; max-width: 1040px; }
  .cycle-node{ flex: 1; position: relative; padding-right: 18px; }
  .cycle-node .cline{
    position: absolute; top: 15px; left: calc(50% + 15px); right: -18px;
    height: 1px; background: var(--line);
  }
  .cycle-node:last-child .cline{ display: none; }
  .cycle-node .cdot{
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 12px; color: var(--accent-soft);
    margin-bottom: 16px;
  }
  .cycle-node strong{ display: block; font-size: 16px; margin-bottom: 6px; }
  .cycle-node span{ font-size: 13px; color: var(--ink-muted); line-height: 1.5; display: block; max-width: 20ch; }
  .cycle-caption{ margin-top: 28px; font-size: 14px; color: var(--ink-muted); font-style: italic; }
  @media (max-width: 760px){
    .cycle-row{ flex-direction: column; gap: 28px; }
    .cycle-node .cline{ display: none; }
  }

  /* ---------- homework ---------- */
  .hw-list{ margin-top: clamp(24px,4vw,40px); max-width: 760px; display: flex; flex-direction: column; gap: 14px; }
  .hw-card{
    display: flex; gap: 20px; align-items: flex-start;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px 24px;
  }
  .hw-card .hnum{
    font-family: var(--font-mono); font-size: 22px; font-weight: 600; color: var(--accent-soft);
    flex-shrink: 0;
  }
  .hw-card strong{ display: block; font-size: 16px; margin-bottom: 4px; }
  .hw-card span{ font-size: 13.5px; color: var(--ink-muted); }
  .hw-foot{
    margin-top: 24px; font-family: var(--font-mono); font-size: 13px;
    color: var(--ink-muted); display: flex; gap: 8px; align-items: center;

  .kbd-hint{
    position: fixed; bottom: 58px; right: clamp(24px,8vw,132px);
    font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted);
    opacity: 0.5; z-index: 5; letter-spacing: 0.04em;
  }
  @media (max-width: 640px){ .kbd-hint{ display: none; } }
</style>

function renderSlide(s, idx){
  const el = document.createElement('div');
  el.className = 'slide tpl-' + s.type;

  const wrap = document.createElement('div');

  if(s.type === 'title'){
    wrap.innerHTML = `
      <div class="eyebrow">${s.eyebrow}</div>
      <h1 class="title">${s.title}</h1>
      <div class="sub">${s.sub}</div>
      <div class="meta-line"><span class="dot"></span>${s.meta}</div>
    `;
  }

  if(s.type === 'outcome'){
    const items = s.items.map(([t,d]) => `
      <div class="outcome-item">
        <div class="check">${CHECK_SVG}</div>
        <div class="otext"><strong>${t}</strong><span>${d}</span></div>
      </div>`).join('');
    wrap.innerHTML = `
      <div class="eyebrow">${s.eyebrow}</div>
      <h2 class="head">${s.head}</h2>
      <div class="outcome-grid">${items}</div>
    `;
  }

  if(s.type === 'problem'){
    wrap.innerHTML = `
      <div class="eyebrow">${s.eyebrow}</div>
      <h2 class="head">${s.head}</h2>
      <div class="lead">${s.lead}</div>
      <div class="quoteline"><span>→</span>${s.quote}</div>
    `;
  }

  if(s.type === 'agenda'){
    const rows = s.rows.map((r,i) => `
      <div class="agenda-row"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="txt">${r}</span></div>`).join('');
    wrap.innerHTML = `
      <div class="eyebrow">${s.eyebrow}</div>
      <h2 class="head">${s.head}</h2>
      <div class="agenda-list">${rows}</div>
    `;
  }

  if(s.type === 'feature'){
    const points = s.points.map((p,i) => `
      <div class="point-row"><span class="pnum">${String(i+1).padStart(2,'0')}</span><span class="ptxt">${p}</span></div>`).join('');
    wrap.innerHTML = `
      <div class="eyebrow">${s.eyebrow}</div>
      <div class="feature-body">
        <h2 class="head">${s.head}</h2>
        <div class="lead">${s.lead}</div>
        <div class="points">${points}</div>
        <div class="howto"><span>→</span>${s.howto}</div>
      </div>
    `;
  }

  if(s.type === 'case'){
    const steps = s.steps.map((st,i) => `
      <div class="case-item">
        <div class="cnum">${i+1}</div>
        <div class="thr"></div>
        <div class="ctxt">${st}</div>
      </div>`).join('');
    wrap.innerHTML = `
      <div class="eyebrow">${s.eyebrow}</div>
      <h2 class="head">${s.head}</h2>
      <div class="case-list">${steps}</div>
    `;
  }

  if(s.type === 'table'){
    const headCells = s.headers.map(h => `<th>${h}</th>`).join('');
    const rows = s.rows.map(cols => {
      const cells = cols.map((val, i) => {
        if(i === 0) return `<td>${val}</td>`;
        const cls = val === 'Да' ? 'yes' : (val === 'Нет' ? 'no' : (val!=='—' ? 'win' : ''));
        return `<td class="${cls}">${val}</td>`;
      }).join('');
      return `<tr>${cells}</tr>`;
    }).join('');
    wrap.innerHTML = `
      <div class="eyebrow">${s.eyebrow}</div>
      <h2 class="head">${s.head}</h2>
      <div class="table-wrap">
        <table class="cmp">
          <thead><tr>${headCells}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="table-foot"><span>→</span>${s.foot}</div>
      </div>
    `;
  }

  if(s.type === 'cycle'){
    const nodes = s.nodes.map(([n,t,d]) => `
      <div class="cycle-node">
        <div class="cline"></div>
        <div class="cdot">${n}</div>
        <strong>${t}</strong>
        <span>${d}</span>
      </div>`).join('');
    wrap.innerHTML = `
      <div class="eyebrow">${s.eyebrow}</div>
      <h2 class="head">${s.head}</h2>
      <div class="cycle-wrap">
        <div class="cycle-row">${nodes}</div>
        <div class="cycle-caption">${s.caption}</div>
      </div>
    `;
  }

  if(s.type === 'homework'){
    const tasks = s.tasks.map(([t,d],i) => `
      <div class="hw-card">
        <div class="hnum">${i+1}</div>
        <div><strong>${t}</strong><span>${d}</span></div>
      </div>`).join('');
    wrap.innerHTML = `
      <div class="eyebrow">${s.eyebrow}</div>
      <h2 class="head">${s.head}</h2>
      <div class="hw-list">${tasks}</div>
      <div class="hw-foot"><span>→</span>${s.foot}</div>
    `;
  }

  el.appendChild(wrap);
  return el;
}

const deck = document.getElementById('deck');
const threadEl = document.getElementById('thread');
const counterEl = document.getElementById('counter');
const memTagEl = document.getElementById('memTag');

SLIDES.forEach((s, i) => deck.appendChild(renderSlide(s, i)));
SLIDES.forEach((s, i) => {
  const seg = document.createElement('div');
  seg.className = 'seg';
  seg.dataset.idx = i;
  threadEl.appendChild(seg);
});

const slideEls = Array.from(document.querySelectorAll('.slide'));
const segEls = Array.from(document.querySelectorAll('.seg'));
let current = 0;

function go(idx){
  idx = Math.max(0, Math.min(SLIDES.length - 1, idx));
  slideEls[current].classList.remove('active');
  current = idx;
  slideEls[current].classList.add('active');
  segEls.forEach((seg, i) => seg.classList.toggle('done', i <= current));
  counterEl.textContent = String(current+1).padStart(2,'0') + ' / ' + SLIDES.length;
  memTagEl.textContent = 'mem://' + String(current+1).padStart(2,'0');
}

document.getElementById('prevBtn').addEventListener('click', () => go(current - 1));
document.getElementById('nextBtn').addEventListener('click', () => go(current + 1));

document.addEventListener('keydown', (e) => {
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){ e.preventDefault(); go(current + 1); }
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){ e.preventDefault(); go(current - 1); }
  if(e.key === 'Home'){ e.preventDefault(); go(0); }
  if(e.key === 'End'){ e.preventDefault(); go(SLIDES.length - 1); }
});

let touchStartX = 0;
document.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
document.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 60){ dx < 0 ? go(current + 1) : go(current - 1); }
});

go(0);
</script>
